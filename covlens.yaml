# covlens config for the covlens project itself.
# All other fields fall back to defaults — see example/covlens.yaml for the
# full reference.

# Browser auto-opening.
auto_open: false

exclude_files:
  # cmd/covlens/main.go — `package main` entry point, typically untestable.
  - "main\\.go$"
  # Orchestration shelling out to git/go test; covered end-to-end by
  # internal/covlens/e2e/ (no meaningful unit seam without a DI refactor).
  - "internal/covlens/baseline\\.go$"
  - "internal/covlens/covlens\\.go$"

# Minimum coverage percentage required for the lines you changed.
diff_threshold: 90

# Minimum coverage percentage required for the entire project (all packages).
# Calibrated against the leaf-coverage ceiling — diff.go and full.go contain
# both unit-tested pure helpers and orchestration phases, so neither hits 80%.
total_threshold: 75